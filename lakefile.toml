name = "lean-smt-hammer"
version = "0.1.0"
defaultTargets = ["Hammer"]

# Duper is a superposition prover that runs inside Lean and emits genuine Lean proof
# terms. We use it to turn an unsat core into a kernel-checkable proof -- i.e. proof
# reconstruction, outsourced.
[[require]]
name = "duper"
git = "https://github.com/leanprover-community/duper.git"
rev = "v4.30.0"

[[lean_lib]]
name = "Hammer"
# Tactic code runs in the bytecode interpreter by default, which is an order of
# magnitude slower. Compiling to a shared library drops hammer's Lean-side cost from
# a few hundred milliseconds to a few tens.
precompileModules = true

[[lean_lib]]
name = "HammerTest"
