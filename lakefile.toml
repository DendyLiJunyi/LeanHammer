name = "lean-smt-hammer"
version = "0.1.0"
defaultTargets = ["Hammer"]

# Duper 是一个跑在 Lean 里的 superposition 证明器，产出真正的 Lean 证明项。
# 我们用它把 unsat core 换成一个可过内核的证明——即"外包版"的逆向翻译。
[[require]]
name = "duper"
git = "https://github.com/leanprover-community/duper.git"
rev = "v4.30.0"

[[lean_lib]]
name = "Hammer"
# tactic 代码默认走字节码解释器，慢一个数量级；编成动态库后 hammer 的 Lean 侧
# 开销从数百毫秒降到几十毫秒。
precompileModules = true

[[lean_lib]]
name = "HammerTest"
